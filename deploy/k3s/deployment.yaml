apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-web
  labels:
    app.kubernetes.io/name: codex-web
    app.kubernetes.io/instance: codex-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-web
      app.kubernetes.io/instance: codex-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-web
        app.kubernetes.io/instance: codex-web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # Private GHCR deployments should add imagePullSecrets in an operator overlay.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-codex-home
          # Override this image with Kustomize to an immutable tag such as
          # ghcr.io/tsunheimat/codex-web:sha-<full SHA> for reproducible deploys.
          image: ghcr.io/tsunheimat/codex-web:latest
          imagePullPolicy: Always
          command:
            - /usr/local/bin/codex-web-init.sh
          env:
            - name: CODEX_HOME
              value: /home/codex-web/.codex
            - name: CODEX_CONFIG_SOURCE
              value: /bootstrap-config/config.toml
            - name: CODEX_AUTH_SOURCE
              value: /bootstrap-auth/auth.json
            - name: CODEX_BOOTSTRAP_FORCE_COPY
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: codex-home
              mountPath: /home/codex-web/.codex
            - name: bootstrap-config
              mountPath: /bootstrap-config
              readOnly: true
            - name: bootstrap-auth
              mountPath: /bootstrap-auth
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: webui
          # Keep this image name identical to the init container so Kustomize
          # image replacements update both references.
          image: ghcr.io/tsunheimat/codex-web:latest
          imagePullPolicy: Always
          env:
            - name: HOME
              value: /home/codex-web
            - name: CODEX_HOME
              value: /home/codex-web/.codex
            - name: CODEX_WEBUI_BROWSE_ROOT
              value: /workspace
            - name: CODEX_WEBUI_ALLOW_ANY_PROJECT
              value: "false"
            # Keep the custom-provider credential separate from auth.json. The
            # ConfigMap should contain only provider metadata with
            # env_key = "CODEX_PROVIDER_API_KEY". The optional reference lets
            # the generic deployment work for providers that do not need a key.
            - name: CODEX_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: codex-web-provider
                  key: CODEX_PROVIDER_API_KEY
                  optional: true
          ports:
            - name: http
              containerPort: 8214
          startupProbe:
            tcpSocket:
              port: 8214
            periodSeconds: 5
            timeoutSeconds: 1
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: 8214
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8214
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: codex-home
              mountPath: /home/codex-web/.codex
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: codex-home
          persistentVolumeClaim:
            claimName: codex-web-codex-home
        - name: workspace
          persistentVolumeClaim:
            claimName: codex-web-workspace
        - name: tmp
          emptyDir: {}
        # The ConfigMap and Secrets are operator-owned external inputs. Changes
        # require a rollout because the init container copies them only at Pod
        # start. `codex-web-provider` is read as an environment-only
        # credential input; it is never copied into the persistent Codex home.
        - name: bootstrap-config
          configMap:
            name: codex-web-codex-config
            defaultMode: 0440
            items:
              - key: config.toml
                path: config.toml
        - name: bootstrap-auth
          secret:
            secretName: codex-web-oauth
            defaultMode: 0440
            items:
              - key: auth.json
                path: auth.json
