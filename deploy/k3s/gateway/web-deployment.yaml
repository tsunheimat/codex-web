apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-web-desktop-ui
  labels:
    app.kubernetes.io/name: codex-web-desktop-ui
spec:
  # The compatibility server keeps per-page shell state in memory; run one.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-web-desktop-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-web-desktop-ui
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The packaged Desktop shell sends non-loopback app-server URLs through
        # its fixed local SOCKS proxy. Forward a loopback URL to the gateway
        # Service instead; the bridge and its WebSocket stay inside this Pod.
        - name: gateway-loopback
          image: codex-web:desktop-ui
          imagePullPolicy: Always
          restartPolicy: Always
          command:
            - node
            - -e
            - |
              const net = require("node:net");
              net.createServer((client) => {
                const upstream = net.connect(8215, "codex-web-gateway");
                client.pipe(upstream);
                upstream.pipe(client);
                client.on("error", () => upstream.destroy());
                upstream.on("error", () => client.destroy());
                client.on("close", () => upstream.destroy());
                upstream.on("close", () => client.destroy());
              }).listen(8215, "127.0.0.1");
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
        # The Desktop shell's startup opens its app-server WebSocket through
        # the gateway and the compatibility server exits when that connection
        # is refused. Wait for the local forwarder and gateway Service before
        # starting the shell so a rollout does not leave it crash-looping.
        - name: wait-for-gateway
          # Keep this image name identical to the main container so the
          # Kustomize image replacement updates both references.
          image: codex-web:desktop-ui
          imagePullPolicy: Always
          command:
            - node
            - -e
            - |
              const url = process.env.CODEX_WEB_GATEWAY_URL + "/healthz";
              const deadline = Date.now() + 5 * 60 * 1000;
              (async () => {
                while (Date.now() < deadline) {
                  try {
                    const response = await fetch(url, { signal: AbortSignal.timeout(3000) });
                    if (response.ok) return;
                    console.log(`gateway not ready: ${response.status}`);
                  } catch (error) {
                    console.log(`gateway not reachable: ${error.message}`);
                  }
                  await new Promise((resolve) => setTimeout(resolve, 3000));
                }
                console.error("gateway did not become healthy");
                process.exit(1);
              })();
          env:
            - name: CODEX_WEB_GATEWAY_URL
              value: http://127.0.0.1:8215
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      containers:
        - name: desktop-ui
          # The original Codex Desktop renderer and its Electron compatibility
          # server (the repository's default Dockerfile), pointed at the gateway.
          image: codex-web:desktop-ui
          imagePullPolicy: Always
          # The image's tini entrypoint stays; only the command is set.
          args:
            - node
            - src/server/main.js
            - --host
            - "0.0.0.0"
            - --port
            - "8214"
          env:
            - name: NODE_ENV
              value: production
            - name: HOME
              value: /home/codex-web
            - name: CODEX_HOME
              value: /home/codex-web/.codex
            # No local Codex runtime: every conversation lives on the Desktop.
            - name: CODEX_WEB_RUNTIME_OWNERSHIP
              value: external
            - name: CODEX_WEB_GATEWAY_URL
              value: http://127.0.0.1:8215
            # Cluster-internal plain HTTP between the two pods only.
            - name: CODEX_WEB_GATEWAY_ALLOW_PLAIN_HTTP
              value: "true"
            - name: CODEX_WEB_GATEWAY_BACKEND
              value: windows-desktop
            - name: CODEX_WEB_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codex-web-gateway-tokens
                  key: CODEX_WEB_GATEWAY_TOKEN
            # Browser uploads are staged here before they are copied to Desktop.
            - name: CODEX_WEBUI_BROWSE_ROOT
              value: /workspace
            - name: CODEX_WEBUI_ALLOW_ANY_PROJECT
              value: "false"
            # Exact HTTPS origin of the page, matching the HTTPRoute hostname.
            - name: CODEX_WEB_ALLOWED_ORIGINS
              value: https://codex-test.test.tsunhei.com
          ports:
            - name: http
              containerPort: 8214
          # The shell exits the process when its startup fails (unwritable
          # Codex home, refused gateway connection), so the probes watch the
          # compatibility server's /healthz rather than a client-routed path.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: home
              mountPath: /home/codex-web
            # The image declares /home/codex-web/.codex as a VOLUME. Without an
            # explicit mount, containerd copies the image's root-owned directory
            # into an anonymous volume there and the shell (UID 1000) exits with
            # EACCES creating .codex/sqlite. Mount a writable volume instead.
            - name: codex-home
              mountPath: /home/codex-web/.codex
            - name: workspace
              mountPath: /workspace
            - name: tmp
              mountPath: /tmp
      volumes:
        # Sidebar preferences and the shell's local state; nothing durable.
        - name: home
          emptyDir:
            sizeLimit: 256Mi
        - name: codex-home
          emptyDir:
            sizeLimit: 256Mi
        - name: workspace
          emptyDir:
            sizeLimit: 1Gi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
