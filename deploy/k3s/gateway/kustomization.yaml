apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: codex-web-gateway
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - storage.yaml
  - ingress.yaml
configMapGenerator:
  - name: codex-web-gateway-config
    files:
      - gateway.json=gateway.config.json
# The "ci" workflow publishes both images from the same commit. Pin both
# newTag values to sha-<commit> from a successful run on main before deploying
# a release; test/gateway-deployment.test.cjs rejects mismatched pins.
# Keep the generated ConfigMap hash: configuration edits trigger a rollout.
images:
  - name: codex-web-gateway
    newName: ghcr.io/tsunheimat/codex-web-gateway
    newTag: sha-3cdef8e3556e517f8524c3031065da11781e770e
  # The original-renderer compatibility server image (the repository's default
  # Dockerfile), published by the same workflow run. Pin the same commit.
  - name: codex-web
    newName: ghcr.io/tsunheimat/codex-web
    newTag: sha-3cdef8e3556e517f8524c3031065da11781e770e
