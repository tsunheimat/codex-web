apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: codex-web-gateway
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - storage.yaml
  - ingress.yaml
configMapGenerator:
  - name: codex-web-gateway-config
    files:
      - gateway.json=gateway.config.json
# CI publishes this separate gateway image. Pin newTag to sha-<commit> from
# the successful "gateway image" workflow before deploying a release.
# Keep the generated ConfigMap hash: configuration edits trigger a rollout.
images:
  - name: codex-web-gateway
    newName: ghcr.io/tsunheimat/codex-web-gateway
    newTag: sha-163308592856d8a95a64e4b461f53c2bdb6499e0
  # The original-renderer compatibility server image from the "container
  # image" workflow (the repository's default Dockerfile). Pin the same commit.
  - name: codex-web
    newName: ghcr.io/tsunheimat/codex-web
    newTag: sha-163308592856d8a95a64e4b461f53c2bdb6499e0
