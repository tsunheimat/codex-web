apiVersion: apps/v1
kind: Deployment
metadata:
  name: codex-web-gateway
  labels:
    app.kubernetes.io/name: codex-web-gateway
spec:
  # SQLite WAL and one bridge per backend require a single gateway writer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: codex-web-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codex-web-gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # For a private registry, create this Secret in the same namespace:
      # imagePullSecrets:
      #   - name: gateway-registry
      containers:
        - name: gateway
          # Replaced by the images entry in kustomization.yaml.
          image: codex-web-gateway:desktop
          imagePullPolicy: IfNotPresent
          args:
            - /config/gateway.json
          env:
            - name: NODE_ENV
              value: production
            - name: CODEX_WEB_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codex-web-gateway-tokens
                  key: CODEX_WEB_GATEWAY_TOKEN
            - name: CODEX_WEB_DESKTOP_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: codex-web-gateway-tokens
                  key: CODEX_WEB_DESKTOP_AGENT_TOKEN
          ports:
            - name: http
              containerPort: 8215
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: codex-web-gateway-config
        - name: data
          persistentVolumeClaim:
            claimName: codex-web-gateway-data
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
